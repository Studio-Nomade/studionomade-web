project_id = "studionomade-web"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3001",
  "http://localhost:3001",
  "http://localhost:3001/auth/callback",
  "http://127.0.0.1:3001/auth/callback"
]

# Google OAuth (M04). Los valores reales viven en un .env NO versionado; aquí solo
# se referencian por nombre de variable. El redirect URI que hay que registrar en
# Google Cloud Console apunta a Supabase, no a Next.js:
#   local: http://127.0.0.1:54321/auth/v1/callback
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_CLIENT_SECRET)"
skip_nonce_check = false

[storage]
enabled = true
file_size_limit = "50MiB"
