name: CI

on:
  workflow_dispatch:
    inputs:
      update_visual_snapshots:
        description: Generate visual baselines as an artifact
        type: boolean
        default: false
  pull_request:
    branches: [testing]
  push:
    branches: [testing]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: detect --source=/github/workspace --redact --verbose --no-banner

  validate:
    runs-on: ubuntu-latest
    env:
      # Marcador para CI: solo permite que la página de campaña renderice (la firma
      # anti-spam exige un secreto de >=16 caracteres). No es un secreto real.
      LEAD_FORM_SECRET: ci-placeholder-lead-form-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:css
      - run: pnpm check:tokens
      - run: pnpm check:assets
      - run: pnpm typecheck
      - run: pnpm test:unit
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: test-results/
          if-no-files-found: ignore
      - run: pnpm build
      - name: Dependency audit
        # Bloquea solo advisories critical (RCE-class). Los high de tooling
        # transitivo (DoS) se monitorean aparte para no romper CI con cada CVE nuevo.
        run: pnpm audit --audit-level critical

  visual-baselines:
    if: github.event_name == 'workflow_dispatch' && inputs.update_visual_snapshots
    runs-on: ubuntu-latest
    env:
      # Igual que en `validate`: permite renderizar la página de campaña para capturar.
      LEAD_FORM_SECRET: ci-placeholder-lead-form-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=visual --update-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: tests/e2e/visual/**/*-snapshots/
          if-no-files-found: warn
