<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        padding: 24px 28px;
        background: var(--surface-page);
      }
      .g {
        display: flex;
        gap: 80px;
        align-items: flex-end;
      }
      .n {
        font-size: var(--fs-stat);
        font-weight: var(--fw-stat);
        color: var(--text-heading);
        line-height: 1;
      }
      .l {
        font-size: var(--fs-body-sm);
        color: var(--text-muted);
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="g">
      <div>
        <div class="n">+100</div>
        <div class="l">Marcas desarrolladas</div>
      </div>
      <div>
        <div class="n">+50</div>
        <div class="l">Marcas creadas desde cero</div>
      </div>
      <div>
        <div class="n">+XX</div>
        <div class="l">Experiencias diseñadas</div>
      </div>
    </div>
  </body>
</html>
