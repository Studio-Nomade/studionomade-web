<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        padding: 24px 28px;
        background: var(--surface-page);
      }
      .o {
        width: 200px;
        height: 1px;
        background: var(--sn-rule);
        margin: 0 auto;
      }
      .h {
        text-align: center;
        font-size: 24px;
        font-weight: 700;
        color: var(--text-heading);
        margin-top: 20px;
      }
      .full {
        height: 1px;
        background: var(--sn-rule);
        margin: 32px 0;
      }
      .acc {
        display: inline-block;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--sn-rule);
        font-size: 20px;
        font-weight: 700;
        color: var(--text-heading);
      }
    </style>
  </head>
  <body>
    <div class="o"></div>
    <div class="h">Conoce al equipo</div>
    <div class="full"></div>
    <div class="acc">Valores</div>
  </body>
</html>
