<!-- @dsCard group="Brand" viewport="700x180" name="Motion" subtitle="24px rise + fade on reveal; 1.03 media zoom; everything zeroes under reduced-motion" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        padding: 24px 28px;
        background: var(--surface-page);
      }
      .g {
        display: flex;
        gap: 18px;
      }
      .k {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--text-muted);
        border-left: 1px solid var(--sn-rule);
        padding-left: 12px;
        line-height: 1.9;
      }
      .demo {
        width: 150px;
        height: 96px;
        background: var(--surface-media);
        overflow: hidden;
      }
      .demo > i {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--sn-silver);
        animation: z 2.6s var(--ease-out) infinite alternate;
      }
      @keyframes z {
        to {
          transform: scale(1.03);
        }
      }
      .rev {
        animation: r 2.6s var(--ease-out) infinite alternate;
      }
      @keyframes r {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .demo > i,
        .rev {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="g">
      <div class="demo"><i></i></div>
      <div style="width: 180px">
        <div class="rev" style="font-size: 20px; font-weight: 700; color: var(--text-heading)">
          Entender antes<br />de crear.
        </div>
      </div>
      <div class="k">
        --dur-reveal 900ms<br />--dur-slow 640ms<br />--dur-base 320ms<br />--dur-fast 200ms<br />--ease-out
        cubic-bezier(.16,1,.3,1)
      </div>
    </div>
  </body>
</html>
