<!-- @dsCard group="Brand" viewport="700x180" name="Corners" subtitle="Square by default; pill and circle are deliberate exceptions" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        padding: 24px 28px;
        background: var(--surface-page);
      }
      .g {
        display: flex;
        gap: 28px;
        align-items: center;
      }
      .sq {
        width: 104px;
        height: 72px;
        background: var(--surface-media);
      }
      .pill {
        border: 1px solid var(--sn-ink);
        border-radius: var(--radius-pill);
        padding: 12px 26px;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-strong);
      }
      .circ {
        width: 110px;
        height: 110px;
        border: 1px solid var(--sn-ink);
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 14px;
        color: var(--text-strong);
      }
      .l {
        font-family: var(--font-mono);
        font-size: 9px;
        color: var(--text-faint);
        margin-top: 8px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="g">
      <div>
        <div class="sq"></div>
        <div class="l">0 — media, cards, inputs</div>
      </div>
      <div>
        <div class="pill">Concepto Creativo</div>
        <div class="l">pill — tags & secondary</div>
      </div>
      <div>
        <div class="circ">Contáctanos</div>
        <div class="l">circle — primary CTA</div>
      </div>
    </div>
  </body>
</html>
