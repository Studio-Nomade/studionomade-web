<!-- @dsCard group="Spacing" viewport="700x260" name="Section rhythm" subtitle="--section-y clamp(72,9vw,160) top and bottom; emptiness is the design" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        padding: 24px 28px;
        background: var(--surface-page);
      }
      .s {
        border-top: var(--border-rule);
        border-bottom: var(--border-rule);
        padding: 64px 0;
      }
      .h {
        font-size: 24px;
        font-weight: 700;
        color: var(--text-heading);
      }
      .p {
        font-size: 14px;
        color: var(--text-muted);
        margin-top: 10px;
        max-width: 46ch;
      }
      .tag {
        position: absolute;
        right: 0;
        font-family: var(--font-mono);
        font-size: 9px;
        color: var(--text-faint);
      }
      .w {
        position: relative;
      }
    </style>
  </head>
  <body>
    <div class="w">
      <div class="tag">padding-block: --section-y</div>
      <div class="s">
        <div class="h">Metodología</div>
        <div class="p">
          Entender antes de crear. Creemos que las marcas sólidas no nacen solo de la inspiración.
        </div>
      </div>
    </div>
  </body>
</html>
