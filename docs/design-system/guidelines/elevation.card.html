<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        padding: 24px 28px;
        background: var(--surface-page);
      }
      .g {
        display: flex;
        gap: 24px;
      }
      .b {
        width: 190px;
        height: 90px;
        background: #fff;
        border: 1px solid var(--sn-border);
        display: grid;
        place-items: center;
        font-size: 12px;
        color: var(--text-muted);
      }
      .l {
        font-family: var(--font-mono);
        font-size: 9px;
        color: var(--text-faint);
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="g">
      <div>
        <div class="b">public site</div>
        <div class="l">--shadow-none</div>
      </div>
      <div>
        <div class="b" style="box-shadow: var(--shadow-admin)">admin surface</div>
        <div class="l">--shadow-admin</div>
      </div>
      <div>
        <div class="b" style="box-shadow: var(--shadow-admin-raised)">admin menu</div>
        <div class="l">--shadow-admin-raised</div>
      </div>
    </div>
  </body>
</html>
