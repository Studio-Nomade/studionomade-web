<!-- @dsCard group="Type" viewport="700x220" name="Full scale" subtitle="Every step, set at its real size" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        padding: 24px 28px;
        background: var(--surface-page);
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      td {
        padding: 4px 0;
        vertical-align: baseline;
      }
      td.k {
        font-family: var(--font-mono);
        font-size: 9px;
        color: var(--text-faint);
        width: 120px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <td class="k">display-1 72/300</td>
        <td style="font-size: 42px; font-weight: 300; color: var(--text-display)">Nomade</td>
      </tr>
      <tr>
        <td class="k">h1 36/700</td>
        <td style="font-size: 30px; font-weight: 700; color: var(--text-heading)">Nomade</td>
      </tr>
      <tr>
        <td class="k">h3 24/700</td>
        <td style="font-size: 24px; font-weight: 700; color: var(--text-heading)">Nomade</td>
      </tr>
      <tr>
        <td class="k">lead 20/400</td>
        <td style="font-size: 20px">Nomade</td>
      </tr>
      <tr>
        <td class="k">body 16/400</td>
        <td style="font-size: 16px">Nomade</td>
      </tr>
      <tr>
        <td class="k">small 14/400</td>
        <td style="font-size: 14px">Nomade</td>
      </tr>
      <tr>
        <td class="k">caption 12/400</td>
        <td style="font-size: 12px; color: var(--text-muted)">Nomade</td>
      </tr>
    </table>
  </body>
</html>
